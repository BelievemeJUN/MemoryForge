    \    cnt += amt // c\n    amt %= c\nprint(cnt)"
  tests:
  - expected: '3'
    mode: exact
    desc: 贪心非最优(4+4+1+1=4, 最优3+3+4=3)
  max_attempts: 3
  difficulty: hard
