# MemoryForge 核心评测题库（100 题目标：本文件 58 手写 + LLM 补 42）
# 每题: task(需求) + tests(hidden test，expected/mode/desc) + max_attempts(自愈预算)
# 自愈题: pre_code(初始错误代码，测 fix 修复能力)；安全题见 security_cases.yaml
# 说明: 沙箱只读/断网/禁 os/subprocess/socket/eval，题目全部用标准库计算可得。

# ================= 基础与数学 =================
- id: sum_1_100
  task: "计算 1 加到 100 的和并输出"
  tests: [{expected: "5050", mode: exact, desc: "1..100 和"}]
  max_attempts: 3

- id: factorial_10
  task: "计算 10 的阶乘并输出"
  tests: [{expected: "3628800", mode: exact, desc: "10!"}]
  max_attempts: 3

- id: prime_count_100
  task: "统计 1 到 100 之间质数的个数并输出"
  tests: [{expected: "25", mode: exact, desc: "100 内质数个数"}]
  max_attempts: 3

- id: gcd_48_36
